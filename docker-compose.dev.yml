version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: devpulse-postgres-dev
    environment:
      POSTGRES_USER: devpulse
      POSTGRES_PASSWORD: devpulse_password
      POSTGRES_DB: devpulse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: devpulse-redis-dev
    ports:
      - "6379:6379"

volumes:
  postgres_dev_data:
